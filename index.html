<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    
    <link rel="icon" href="image/favicon.png" class="rounded-favicon">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="image/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- Google Fonts: Klee One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200 selection:bg-violet-500 selection:text-white font-['Klee_One']">

    <div class="max-w-7xl mx-auto flex justify-center w-full min-h-screen">
        
        <!-- 左カラム：ナビゲーション -->
        <header class="hidden sm:flex flex-col items-end w-[88px] xl:w-[280px] shrink-0 h-screen sticky top-0 pb-4 pt-4 px-2 xl:px-6 z-20 justify-between">
            <div class="w-full flex flex-col xl:items-start items-center gap-4">
                <a href="/" class="p-3 mb-2 flex items-center justify-center rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition text-violet-600 dark:text-violet-400">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                    </svg>
                </a>
                <nav class="flex flex-col space-y-2 w-full xl:w-auto items-center xl:items-start font-semibold">
                    <a href="/" class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition text-lg">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <span class="hidden xl:block">設定</span>
                    </a>
                </nav>
            </div>

            <!-- ダークモード切り替えボタン -->
            <div class="w-full flex flex-col xl:items-start items-center">
                <button id="theme-toggle" class="flex items-center gap-4 p-3 w-full rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition text-lg font-semibold">
                    <svg id="theme-icon" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m3.343-5.657l-.707-.707m12.728 12.728l-.707-.707M6.343 17.657l-.707.707m12.728-12.728l-.707-.707M12 5a7 7 0 100 14a7 7 0 000-14z"></path>
                    </svg>
                    <span class="hidden xl:block" id="theme-text">ダークモード</span>
                </button>
            </div>
        </header>

        <!-- 中央カラム -->
        <main class="w-full sm:w-[640px] max-w-[640px] shrink-0 min-h-screen bg-white dark:bg-[#0a0a0a] border-x border-gray-200 dark:border-gray-800 shadow-sm relative pb-12">
            <!-- ヘッダー -->
            <div class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-white/85 dark:bg-[#0a0a0a]/85 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
                <div class="flex items-center gap-4">
                    <button class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </button>
                    <div>
                        <h1 class="font-bold text-lg flex items-center gap-1.5 leading-tight">
                            <span id="header-name"></span>
                            <span id="header-badge" class="text-sm"></span>
                        </h1>
                        <p class="text-[13px] text-gray-500 font-medium"><span id="header-posts"></span> 投稿</p>
                    </div>
                </div>
                <!-- スマホ用テーマ切り替えボタン -->
                <button id="mobile-theme-toggle" class="sm:hidden p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>

            <!-- カバー画像 -->
            <div id="profile-cover" class="h-40 sm:h-48 w-full bg-gray-200 dark:bg-gray-800 bg-cover bg-center"></div>

            <!-- プロフィール情報 -->
            <div class="px-5 pt-3 pb-4">
                <div class="flex justify-between items-end -mt-16 sm:-mt-20 mb-4">
                    <img id="profile-icon" src="" class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl border-4 border-white dark:border-[#0a0a0a] object-cover relative z-10 bg-gray-200 dark:bg-gray-800 shadow-sm">
                    <button class="px-5 py-2 rounded-xl bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 font-bold text-[15px] hover:bg-gray-700 dark:hover:bg-gray-300 transition shadow-sm">フォローする</button>
                </div>
                <div class="mb-4">
                    <h2 class="text-2xl font-extrabold flex items-center gap-1.5 tracking-tight">
                        <span id="profile-name"></span>
                        <span id="profile-badge" class="text-[15px]"></span>
                    </h2>
                    <p id="profile-handle" class="text-[15px] text-gray-500 font-medium"></p>
                </div>
                <p id="profile-bio" class="text-[15px] whitespace-pre-wrap mb-4 leading-relaxed"></p>
                
                <div id="profile-meta" class="flex flex-wrap gap-x-5 gap-y-2 text-[14px] text-gray-500 mb-4 font-medium"></div>

                <div class="flex gap-5 text-[15px]">
                    <span class="cursor-pointer group"><strong id="profile-following" class="font-bold text-gray-900 dark:text-white group-hover:underline"></strong> <span class="text-gray-500 group-hover:underline">フォロー</span></span>
                    <span class="cursor-pointer group"><strong id="profile-followers" class="font-bold text-gray-900 dark:text-white group-hover:underline"></strong> <span class="text-gray-500 group-hover:underline">フォロワー</span></span>
                </div>
            </div>

            <!-- タブ -->
            <div class="flex text-[15px] font-bold border-b border-gray-200 dark:border-gray-800">
                <div class="flex-1 py-4 text-center cursor-pointer text-violet-600 dark:text-violet-400 border-b-2 border-violet-600 dark:border-violet-400 bg-violet-50/50 dark:bg-violet-900/10">投稿</div>
                <div class="flex-1 py-4 text-center text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-900 cursor-pointer">メディア</div>
                <div class="flex-1 py-4 text-center text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-900 cursor-pointer">いいね</div>
            </div>

            <!-- タイムライン -->
            <div id="timeline" class="divide-y divide-gray-100 dark:divide-gray-800"></div>
        </main>

        <!-- 右カラム -->
        <aside class="hidden lg:block w-[320px] xl:w-[350px] shrink-0 pl-6 xl:pl-8 py-4 sticky top-0 h-screen overflow-y-auto no-scrollbar">
            <div class="sticky top-0 bg-gray-50 dark:bg-gray-950 pt-1 pb-4 z-10">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400 group-focus-within:text-violet-600 dark:group-focus-within:text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" placeholder="検索する..." class="w-full bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-white rounded-xl py-2.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500 text-[15px]">
                </div>
            </div>

            <div class="bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 rounded-2xl pt-4 pb-2 shadow-sm">
                <h2 class="font-extrabold text-lg px-5 mb-3">話題のコンテンツ</h2>
                <div id="trends"></div>
            </div>
            
            <div class="px-2 mt-6 flex flex-wrap gap-x-4 gap-y-2 text-[13px] text-gray-400">
                <a href="#" class="hover:underline">利用規約</a>
                <a href="#" class="hover:underline">プライバシーポリシー</a>
                <span id="footer-copyright"></span>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
